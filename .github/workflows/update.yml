name: 🔄 自动更新 Clash 12节点订阅配置

on:
  # 定时调度更新 (每天定时自动抓取一次，北京时间凌晨 04:00 / UTC 20:00)
  schedule:
    - cron: '0 20 * * *'
  # 支持在 GitHub 网页上直接点击按钮手动执行
  workflow_dispatch:
  # 推送修改时也可以触发
  push:
    paths:
      - 'urls.txt'
      - 'template.yaml'
      - 'scripts/**'

# 设置操作权限以允许推送更新后的 config.yaml
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-clash-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 设置 Python 3 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 安装依赖项 (PyYAML & requests)
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests urllib3

      - name: 🚀 执行节点抓取与合并脚本
        run: |
          python scripts/update_clash.py

      - name: 🔍 检查文件变动
        id: check_changes
        run: |
          git status --porcelain
          if [[ -n $(git status --porcelain config.yaml config.b64) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: 📤 提交并推送到 GitHub 仓库
        if: steps.check_changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add config.yaml config.b64
          git commit -m "chore(auto): 自动更新 12 节点订阅配置 [skip ci] ($(date +'%Y-%m-%d %H:%M:%S'))" || true
          git pull --rebase || true
          git push origin HEAD || git push
